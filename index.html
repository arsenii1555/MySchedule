<style>
/* Розклад як дзвінкова таблиця: зліва рейка з номером пари й часом, справа предмет; поточна пара «дзвенить» сигнальним кольором */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface2:#f5f7fa; --ink:#141a26; --muted:#5a6476; --faint:#8a93a3; --line:#d8dde6;
  --accent:#1d3b8f; --accent-soft:#e3e9f8; --on-accent:#ffffff;
  --bell:#d24a12; --bell-soft:#fbe9e0;
  --lec:#1d3b8f; --lec-bg:#e3e9f8; --pr:#0f6b4f; --pr-bg:#dff2ea; --sem:#7a3f9a; --sem-bg:#f1e6f7;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#171c27; --surface2:#1d2330; --ink:#e8ecf3; --muted:#9aa4b6; --faint:#6c7689; --line:#2a3141;
  --accent:#8aa6ff; --accent-soft:#1f2a4a; --on-accent:#0e121a;
  --bell:#ff7a3d; --bell-soft:#3a2216;
  --lec:#9fb6ff; --lec-bg:#1f2a4a; --pr:#5fd3a6; --pr-bg:#16342a; --sem:#d29cf0; --sem-bg:#33223f;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#171c27; --surface2:#1d2330; --ink:#e8ecf3; --muted:#9aa4b6; --faint:#6c7689; --line:#2a3141;
  --accent:#8aa6ff; --accent-soft:#1f2a4a; --on-accent:#0e121a;
  --bell:#ff7a3d; --bell-soft:#3a2216;
  --lec:#9fb6ff; --lec-bg:#1f2a4a; --pr:#5fd3a6; --pr-bg:#16342a; --sem:#d29cf0; --sem-bg:#33223f;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

/* шапка */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.mark{font:700 22px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--bell);display:inline-block;transform:translateY(-1px)}
.grp{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;font-weight:600;font-size:14px;min-width:0}
.grp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp small{font:600 11px var(--f-mono);color:var(--muted)}
.frac{display:inline-grid;grid-template-rows:auto auto;line-height:1;font:600 9.5px/1.05 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 6px;border-radius:6px;background:var(--surface2);color:var(--faint)}
.frac b{font-weight:600}
.frac b:first-child{border-bottom:1px solid currentColor;padding-bottom:1px;margin-bottom:1px}
.frac.c b:first-child,.frac.z b:last-child{color:var(--accent)}

/* вкладки внизу */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;padding:6px 0;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--faint)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}

/* смуга днів */
.days{display:grid;grid-template-columns:auto repeat(5,1fr) auto;gap:4px;align-items:stretch;margin-block:4px 14px}
.days .nav{background:none;border:0;color:var(--muted);font-size:18px;padding:0 4px}
.day{border:1px solid transparent;background:none;border-radius:12px;padding:6px 0 7px;display:grid;justify-items:center;gap:1px}
.day b{font:600 11px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day span{font:600 17px var(--f-mono)}
.day.today span{color:var(--bell)}
.day[aria-pressed="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.day .dots{display:flex;gap:2px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--faint);opacity:.6}

/* картка «зараз / далі» */
.bell{border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line)}
.bell.live{background:var(--bell-soft);border-color:transparent}
.bell .lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bell.live .lbl{color:var(--bell)}
.bell .big{font:600 19px/1.25 var(--f-body);text-wrap:balance}
.bell .sub{color:var(--muted);font-size:14px}
.bell .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bell .bar i{display:block;height:100%;background:var(--bell)}

/* список пар */
.h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 8px}
.h h2{font:600 17px var(--f-body);margin:0}
.h small{color:var(--muted);font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.cont{border-top:1px dashed var(--line)}
.rail{display:grid;justify-items:start;gap:0;font:500 12px/1.35 var(--f-mono);color:var(--muted)}
.rail b{font:700 20px/1 var(--f-display);color:var(--ink);margin-bottom:3px}
.row.now .rail b{color:var(--bell)}
.row.now{background:var(--bell-soft)}
.row.past .body,.row.past .room{opacity:.55}
.body{min-width:0;display:grid;gap:3px}
.subj{font-weight:600;line-height:1.3}
.meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.kind{font:600 11px var(--f-body);padding:2px 7px;border-radius:999px;background:var(--lec-bg);color:var(--lec)}
.kind.pr{background:var(--pr-bg);color:var(--pr)}
.kind.sem{background:var(--sem-bg);color:var(--sem)}
.wk{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--accent);border:1px solid currentColor;border-radius:5px;padding:0 4px}
.room{font:600 14px var(--f-mono);text-align:right;white-space:nowrap}
.room small{display:block;font:500 11px var(--f-body);color:var(--faint)}
.gap{padding:7px 14px 7px 78px;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);background:var(--surface2)}
.pick{color:var(--accent);background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* сегмент */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.note{color:var(--muted);font-size:13px;margin:8px 2px 0}

/* пошук */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.grps{font:500 12px var(--f-mono);color:var(--faint)}

/* налаштування / вибір групи */
.setup{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.setup .wrap{padding-block:20px 40px}
.setup h1{font:700 30px/1.1 var(--f-display);letter-spacing:-.02em;margin:18px 0 6px;text-wrap:balance}
.setup p.lead{color:var(--muted);margin:0 0 20px;max-width:40ch}
.step{font:600 12px var(--f-mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;gap:8px}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c1{grid-template-columns:1fr}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;font-weight:600;text-align:center;display:grid;gap:2px}
.opt small{font-weight:500;color:var(--muted);font-size:12.5px}
.opt.big{font:700 26px/1 var(--f-display);padding:18px 0}
.opt.left{text-align:left;padding:13px 14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stream{margin-top:14px}
.stream .lab{font:600 11px var(--f-mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:0 2px 6px}
.back{background:none;border:0;color:var(--muted);padding:6px 0;font-weight:600}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--on-accent);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sheet-list{display:grid;gap:8px;margin-top:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.hint button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.demo{background:var(--bell-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.opt.elopt{padding:0;display:grid;gap:0;text-align:left}
.elbtn{display:flex;gap:12px;align-items:flex-start;background:none;border:0;padding:13px 14px;text-align:left;font-weight:600;width:100%}
.elbtn small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);margin-top:1px;display:grid;place-items:center}
.elbtn[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.elbtn[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.egs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 12px 46px;color:var(--muted);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.elopt[aria-pressed="true"]{color:var(--ink)}
.sticky-cta{position:sticky;bottom:0;display:grid;gap:8px;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.row,.bell{transition:background .3s}}

/* заставка при запуску: «П•» → крапка відʼїжджає, зʼявляється «ара» → логотип летить у шапку */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
.sp-bg{position:absolute;inset:0;background:var(--bg)}
.sp-mark{position:relative;display:flex;align-items:baseline;font:700 clamp(56px,19vw,88px)/1 var(--f-display);letter-spacing:-.02em;color:var(--ink);opacity:0;transform-origin:0 0}
.sp-ara{display:inline-block;white-space:nowrap;width:0;clip-path:inset(-.5em -.06em -.5em 0)}
.sp-ara span{display:inline-block}
.sp-dot{width:.32em;height:.32em;margin-left:.09em;border-radius:50%;background:var(--bell);transform:translateY(-.045em)}
.splashing header .mark{visibility:hidden}
@media (prefers-reduced-motion:reduce){.splash{display:none}}
</style>

</head>

function shortGroups(g){if(g.length===1)return g[0];const pre=g[0].replace(/[^-]+$/,"");return g.every(x=>x.startsWith(pre))?pre+g.map(x=>x.slice(pre.length)).join(", "):g.join(", ");}

/* ---------- Сьогодні ---------- */
function bellCard(){const t=today0(),dow=t.getDay();const nm=nowMin();
  const dayLs=d=>inSem(d)&&d.getDay()>=1&&d.getDay()<=6?lessonsFor(sel,d.getDay(),weekType(d)):[];
  const ls=dayLs(t).filter(l=>!l.pickFl||true);
  const cur=ls.find(l=>nm>=mins(tm(l)[0])&&nm<mins(tm(l)[1]));
  if(cur){const[a,b]=tm(cur);const left=mins(b)-nm,pc=Math.round((nm-mins(a))/(mins(b)-mins(a))*100);const nx=ls.find(l=>l.p>cur.p);
    return '<div class="bell live"><div class="lbl">Зараз · '+cur.p+' пара · ще '+dur(left)+'</div><div class="big">'+esc(cur.s)+'</div><div class="sub">'+[cur.r?"ауд. "+esc(cur.r):"",cur.pickFl?"обери групу з мови":cur.pickEl?"обери свої вибіркові":esc(cur.t)].filter(Boolean).join(" · ")+(nx?'<br>Далі о '+fmtT(tm(nx)[0])+': '+esc(nx.s)+(nx.r?', '+esc(nx.r):''):'')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';}
  const nx=ls.find(l=>mins(tm(l)[0])>nm);
  if(nx){const st=mins(tm(nx)[0]);return '<div class="bell"><div class="lbl">Далі · '+nx.p+' пара о '+fmtT(tm(nx)[0])+' · через '+dur(st-nm)+'</div><div class="big">'+esc(nx.s)+'</div><div class="sub">'+[nx.r?"ауд. "+esc(nx.r):"",nx.pickFl?"обери групу з мови":nx.pickEl?"обери свої вибіркові":esc(nx.t)].filter(Boolean).join(" · ")+'</div></div>';}
  for(let i=1;i<=10;i++){const d=addDays(t,i);const L=dayLs(d);if(L.length){const f=L[0];
    return '<div class="bell"><div class="lbl">'+(ls.length?"Пари на сьогодні закінчились":"Сьогодні пар немає")+'</div><div class="big">'+(i===1?"Завтра":DOWF[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()])+' перша о '+fmtT(tm(f)[0])+'</div><div class="sub">'+esc(f.s)+(f.r?' · ауд. '+esc(f.r):'')+'</div></div>';}}
  return '<div class="bell"><div class="lbl">Найближчим часом пар немає</div><div class="big">Відпочивай</div></div>';}
function viewToday(){const t=today0();if(!ui.day){const dw=t.getDay();ui.day=dw===0?addDays(t,1):dw===6?addDays(t,2):t;ui.wkOff=0;}
  const mon=mondayOf(ui.day);const wt=weekType(mon);let strip='<div class="days"><button class="nav" data-act="wk" data-n="-1" aria-label="Попередній тиждень">‹</button>';
  for(let i=0;i<5;i++){const d=addDays(mon,i);const n=inSem(d)?lessonsFor(sel,d.getDay(),wt).length:0;
    strip+='<button class="day'+(ymd(d)===ymd(t)?" today":"")+'" data-act="day" data-d="'+ymd(d)+'" aria-pressed="'+(ymd(d)===ymd(ui.day))+'"><b>'+DOWS[d.getDay()]+'</b><span>'+d.getDate()+'</span><span class="dots">'+'<i></i>'.repeat(Math.min(n,5))+'</span></button>';}
  strip+='<button class="nav" data-act="wk" data-n="1" aria-label="Наступний тиждень">›</button></div>';
  const d=ui.day,ls=inSem(d)?lessonsFor(sel,d.getDay(),wt):[];const isT=ymd(d)===ymd(t);
  const rel=isT?"Сьогодні":ymd(d)===ymd(addDays(t,1))?"Завтра":DOWF[d.getDay()];
  return demoNote()+bellCard()+strip+'<div class="h"><h2>'+rel+', '+d.getDate()+' '+MON[d.getMonth()]+'</h2><small>'+WT[wt]+' · '+ls.length+' '+plural(ls.length,"пара","пари","пар")+'</small></div>'+
    rowsHTML(ls,{live:isT,empty:inSem(d)?"Цього дня пар немає":"Поза семестром"})+installHint();}
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c;};

const norm=s=>String(s||"").toLowerCase().replace(/[ʼ’'`]/g,"").replace(/\s+/g," ").trim();
function viewSearch(){let h='<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" inputmode="search" placeholder="Викладач, аудиторія або предмет" aria-label="Пошук" value="'+esc(ui.q)+'" autocomplete="off"></div>';
  h+='<div id="res">'+searchRes()+'</div>';return h;}
function searchRes(){const q=norm(ui.q);if(q.length<2)return '<p class="note">Знайди, де і коли пари у викладача, що зараз в аудиторії або коли предмет у будь-якої групи факультету. Наприклад: <button class="pick" data-act="q" data-q="Ничка">Ничка</button>, <button class="pick" data-act="q" data-q="402Ю">402Ю</button>, <button class="pick" data-act="q" data-q="Логіка">Логіка</button>.</p>';
  const hits=[];DATA.courses.forEach(C=>C.L.forEach(l=>{if(norm(l.t).includes(q)||norm(l.r).replace(/\s/g,"").includes(q.replace(/\s/g,""))||norm(l.s).includes(q))hits.push(Object.assign({c:C.n},l));}));
  if(!hits.length)return '<div class="list" style="margin-top:12px"><div class="empty">Нічого не знайдено за «'+esc(ui.q)+'»</div></div>';
  const wt=weekType(today0());let h='<p class="note">'+hits.length+' '+plural(hits.length,"заняття","заняття","занять")+'. Позначка «чис» чи «знам» — лише по чисельнику чи знаменнику; цей тиждень — '+WT[wt]+'.</p>';
  for(let d=1;d<=6;d++){const ls=hits.filter(l=>l.d===d).sort((a,b)=>a.p-b.p||a.c-b.c);if(!ls.length)continue;
    const merged=[];ls.forEach(l=>{const m=merged.find(x=>x.p===l.p&&x.s===l.s&&x.t===l.t&&x.r===l.r&&x.w===l.w&&x.k===l.k);if(m)m.g=[...new Set(m.g.concat(l.g))];else merged.push(Object.assign({},l,{g:l.g.slice()}));});
    h+='<div class="h"><h2>'+DOWF[d]+'</h2><small>'+merged.length+'</small></div>'+rowsHTML(merged.slice(0,60),{showW:true,groups:true});}
  return h;}

    E.map(e=>{const on=e.el in sel_;const egs=[...e.egs].sort((a,b)=>a-b);
      return '<div class="opt left elopt" aria-pressed="'+on+'"><button class="elbtn" data-act="suEl" data-el="'+esc(e.el)+'" aria-pressed="'+on+'"><span class="box" aria-hidden="true"></span><span>'+esc(e.el)+'<small>'+esc(e.ct||"вибіркова")+(egs.length?' · '+egs.length+' '+plural(egs.length,"група","групи","груп"):'')+'</small></span></button>'+
        (on&&egs.length?'<div class="egs"><span>Моя група:</span>'+egs.map(g=>'<button class="chip" data-act="suEg" data-el="'+esc(e.el)+'" data-n="'+g+'" aria-pressed="'+(sel_[e.el]===g)+'">'+g+'</button>').join("")+'<button class="chip" data-act="suEg" data-el="'+esc(e.el)+'" data-n="0" aria-pressed="'+(sel_[e.el]===0)+'">не знаю</button></div>':'')+'</div>';}).join("")+
    '</div><div class="sticky-cta"><button class="btn" data-act="suElDone">'+(n?'Готово · '+n+' '+plural(n,"предмет","предмети","предметів"):'Готово')+'</button>'+(n?'':'<button class="btn ghost" data-act="suElSkip">Обрати пізніше</button>')+'</div>';}
  $("setup").innerHTML=h+'</div>';if(!s.keep)$("setup").scrollTop=0;s.keep=false;}

(function(){let code="";try{code=new URLSearchParams(location.search).get("g")||"";}catch(e){}if(!code&&/^#[a-z0-9-]+$/.test(location.hash))code=location.hash.slice(1);
  if(!code)return;const hit=allGroups().find(x=>slug(x.g)===code.toLowerCase());if(!hit||(sel&&sel.g===hit.g))return;
  su={step:2,c:hit.c,g:hit.g,sg:0,fl:""};$("setup").hidden=false;suNext();})();
render();
setInterval(()=>{if(ui.tab==="today"&&sel&&!document.hidden)render();},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sel){ui.day=null;render();}});

/* ---------- заставка при запуску ---------- */
(function(){const sp=$("splash"),root=document.documentElement;if(!sp)return;let done=false;
  const end=()=>{if(done)return;done=true;root.classList.remove("splashing");sp.remove();};
  if(!sp.animate||matchMedia("(prefers-reduced-motion: reduce)").matches)return end();
  root.classList.add("splashing");sp.addEventListener("click",end);setTimeout(end,4000); // дотик пропускає; запобіжник, якщо щось піде не так
  const q=s=>sp.querySelector(s),mk=q(".sp-mark"),ara=q(".sp-ara");
  const A=(el,kf,o)=>el.animate(kf,Object.assign({fill:"both"},o));
  const fonts=document.fonts&&document.fonts.load?document.fonts.load('700 64px "Unbounded"',"Пара").catch(()=>{}):Promise.resolve();
  Promise.race([fonts,new Promise(r=>setTimeout(r,500))]).then(()=>{if(done)return;try{
    ara.style.width="auto";const W=ara.getBoundingClientRect().width;ara.style.width="0px";mk.style.opacity=1;
    A(q(".sp-p"),[{opacity:0,transform:"scale(.6)"},{opacity:1,transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.2,.9,.3,1.15)"});
    A(q(".sp-dot"),[{transform:"translateY(-.045em) scale(0)"},{transform:"translateY(-.045em) scale(1)"}],{duration:320,delay:220,easing:"cubic-bezier(.3,1.6,.5,1)"});
    A(ara,[{width:"0px"},{width:W+"px"}],{duration:520,delay:620,easing:"cubic-bezier(.65,0,.35,1)"});
    [...ara.children].forEach((c,i)=>A(c,[{opacity:0,transform:"translateY(.25em)"},{opacity:1,transform:"none"}],{duration:300,delay:700+i*90,easing:"ease-out"}));
    setTimeout(fly,1300);}catch(e){end();}});
  function fly(){if(done)return;sp.style.pointerEvents="none";const t=document.querySelector("header .mark");let a;
    if(t){const r=mk.getBoundingClientRect(),b=t.getBoundingClientRect(),s=parseFloat(getComputedStyle(t).fontSize)/parseFloat(getComputedStyle(mk).fontSize);
      a=A(mk,[{transform:"none"},{transform:"translate("+(b.left-r.left)+"px,"+(b.top-r.top)+"px) scale("+s+")"}],{duration:520,easing:"cubic-bezier(.5,0,.15,1)"});}
    else a=A(mk,[{opacity:1,transform:"none"},{opacity:0,transform:"scale(.92)"}],{duration:320,easing:"ease-in"}); // ще не обрана група — шапки немає, просто зникає
    A(q(".sp-bg"),[{opacity:1},{opacity:0}],{duration:420,delay:t?80:0,easing:"ease-out"});
    a.finished.then(end,end);}
})();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
